name: CI

# Builds the app on every push / pull request so compile errors never reach main.
# Releases are built by release.yml when a tag is pushed.

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (universal)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        # The image ships several Xcodes; always drive the build with a full
        # Xcode (Command Line Tools cannot expand SwiftUI macros) and pin it
        # for every later step via DEVELOPER_DIR.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "--- resolved toolchain ---"
          xcode-select -p
          xcrun --find swiftc
          swift --version
          sw_vers

      - name: Run core tests
        # Pure-logic tests for timing rules and settings; they need XCTest,
        # which only ships with a full Xcode (selected above).
        run: swift test --filter CatnapCoreTests

      - name: Check formatting
        # Style is enforced rather than hand-maintained; config in .swift-format.
        # `--strict` turns would-be warnings into a failing exit code. `swift format`
        # only exists from Xcode 16 on, so an older runner skips instead of failing
        # the whole build over a missing subcommand.
        run: |
          if ! swift format --version > /dev/null 2>&1; then
            echo "::warning::swift format is not available in this toolchain; skipping the style check"
            exit 0
          fi
          swift format lint --recursive --strict src core Tests

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build
        # `ci` mode = release config, universal binary, ad-hoc signed,
        # LetMeCatnap.zip + LetMeCatnap.dmg in ./dist, nothing is uploaded or launched.
        # `tee` keeps the whole console output while build.sh also writes
        # build.log for the failure summary below.
        run: |
          set -o pipefail
          ./build.sh ci 2>&1 | tee build-console.log

      - name: Failure summary
        if: failure()
        run: |
          echo "===== build.log (last 800 lines) ====="
          tail -n 800 build.log 2>/dev/null || echo "(build.log not created)"
          echo "===== console (last 200 lines) ====="
          tail -n 200 build-console.log 2>/dev/null || true
          {
            echo "### Build failed"
            echo '```'
            tail -n 80 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-console.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify artifacts
        run: |
          test -f dist/LetMeCatnap.zip || { echo "::error::dist/LetMeCatnap.zip missing"; exit 1; }
          unzip -l dist/LetMeCatnap.zip | head -20
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "dist/LetMeCatnap.app/Contents/Info.plist"
          lipo -archs "dist/LetMeCatnap.app/Contents/MacOS/LetMeCatnap"
          codesign --verify --deep --strict --verbose=2 dist/LetMeCatnap.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LetMeCatnap-${{ github.sha }}
          path: |
            dist/LetMeCatnap.zip
            dist/LetMeCatnap.dmg
          if-no-files-found: warn
          retention-days: 14
