name: Release

# Push a tag like v2.0.0 (or run this workflow manually) to build a signed /
# notarized (when certificates are configured) universal build and publish it as
# a GitHub Release.
#
# Updates are delivered by Sparkle (see src/Updater.swift). Every release must
# publish three things together:
#   - `LetMeCatnap.zip`     the update archive Sparkle downloads (exact name)
#   - `appcast.xml`  the feed, signed with the EdDSA key from Info.plist
#   - a release title that starts with "LetMeCatnap <version>" (for humans)
# `SUFeedURL` points at releases/latest/download/appcast.xml, so publishing a
# release is what makes an update visible — no separate feed host.
#
# Repository secrets:
#   SPARKLE_ED_PRIVATE_KEY  base64 EdDSA private key (REQUIRED — the appcast
#                           cannot be signed without it and Sparkle rejects
#                           unsigned entries). Generate with Sparkle's
#                           `generate_keys`; the public half lives in
#                           Info.plist as SUPublicEDKey.
#   MACOS_CERT_P12          base64(.p12) with a "Developer ID Application" cert
#   MACOS_CERT_PASSWORD     password of that .p12
#   NOTARY_APPLE_ID         Apple ID for notarization
#   NOTARY_TEAM_ID          10-character team id
#   NOTARY_APP_PASSWORD     app-specific password
# Without the certificate the build is ad-hoc signed: it runs fine after the user
# clears the quarantine attribute (see the release notes this workflow generates).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not of the form x.y.z"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Select Xcode
        # Always build with a full Xcode: Command Line Tools cannot expand the
        # SwiftUI macros (@State etc.) this app uses, and the image ships
        # several Xcode versions that come and go between image updates.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcode-select -p
          xcrun --find swiftc
          swift --version

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate"
            exit 1
          fi
          echo "CATNAP_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Configure notarization
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_APPLE_ID != ''
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "letmecatnap-ci" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD"
          echo "CATNAP_NOTARY_PROFILE=letmecatnap-ci" >> "$GITHUB_ENV"

      - name: Run core tests
        run: swift test --filter CatnapCoreTests

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Check formatting
        # A release is the one build that reaches users, so it gets the same
        # style gate as CI. `swift format` only exists from Xcode 16 on, hence
        # the probe — a missing subcommand must not fail the release.
        run: |
          if ! swift format --version > /dev/null 2>&1; then
            echo "::warning::swift format is not available in this toolchain; skipping the style check"
            exit 0
          fi
          swift format lint --recursive --strict src core Tests

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build
        env:
          CATNAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          ./build.sh ci 2>&1 | tee build-console.log

      - name: Failure summary
        if: failure()
        run: |
          echo "===== build.log (last 800 lines) ====="
          tail -n 800 build.log 2>/dev/null || echo "(build.log not created)"
          echo "===== console (last 200 lines) ====="
          tail -n 200 build-console.log 2>/dev/null || true
          {
            echo "### Build failed"
            echo '```'
            tail -n 80 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -f dist/LetMeCatnap.zip || { echo "::error::dist/LetMeCatnap.zip missing"; exit 1; }
          # Sparkle must be inside the bundle and reachable through the rpath,
          # otherwise every copy except the one on the build machine fails to
          # launch with a dyld error.
          test -d dist/LetMeCatnap.app/Contents/Frameworks/Sparkle.framework || {
            echo "::error::Sparkle.framework was not embedded"
            exit 1
          }
          otool -L dist/LetMeCatnap.app/Contents/MacOS/LetMeCatnap | grep -q "@rpath/Sparkle.framework" || {
            echo "::error::executable is not linked against Sparkle"
            exit 1
          }
          # The updater requires this exact asset name and a matching version.
          BUILT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            'dist/LetMeCatnap.app/Contents/Info.plist')"
          test "$BUILT" = "${{ steps.version.outputs.version }}" || {
            echo "::error::Bundle version $BUILT != ${{ steps.version.outputs.version }}"
            exit 1
          }
          lipo -archs dist/LetMeCatnap.app/Contents/MacOS/LetMeCatnap
          unzip -l dist/LetMeCatnap.zip | head -10

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set. Sparkle refuses unsigned entries, so publishing without it would ship a release nobody can update from. Add the key as a repository secret."
            exit 1
          fi
          # The tools come with the Sparkle binary artifact that SwiftPM already
          # downloaded for the build.
          TOOLS="$PWD/.build/artifacts/sparkle/Sparkle/bin"
          test -x "$TOOLS/generate_appcast" || {
            echo "::error::generate_appcast not found under .build/artifacts"
            exit 1
          }

          mkdir -p feed
          cp dist/LetMeCatnap.zip feed/
          # `--ed-key-file -` keeps the private key off disk and out of argv.
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$TOOLS/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$REPO/releases/download/v$VERSION/" \
            --link "https://github.com/$REPO" \
            feed/

          test -f feed/appcast.xml || { echo "::error::appcast.xml was not generated"; exit 1; }
          grep -q "<sparkle:version>$VERSION</sparkle:version>" feed/appcast.xml || {
            echo "::error::appcast.xml does not advertise $VERSION"
            sed -n '1,80p' feed/appcast.xml
            exit 1
          }
          cp feed/appcast.xml dist/appcast.xml
          echo "--- appcast.xml ---"
          cat dist/appcast.xml

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --pretty='- %s (%h)' "$PREV..HEAD")"
            RANGE="Changes since $PREV"
          else
            CHANGES="$(git log --pretty='- %s (%h)' -20)"
            RANGE="Recent changes"
          fi

          {
            echo "简体中文版 · Universal binary (Apple Silicon + Intel) · macOS 13+"
            echo
            echo "### 安装 / Install"
            echo '1. 下载 `LetMeCatnap.dmg`，把 `LetMeCatnap.app` 拖进“应用程序”。'
            echo '2. 首次打开若提示“已损坏”或“无法验证开发者”，在终端执行：'
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/LetMeCatnap.app'
            echo '```'
            echo
            echo '3. 也可以直接用 `LetMeCatnap.zip`（应用内自动更新使用的就是这个包）。'
            echo
            # Any 2.x release can still be installed by someone coming from
            # 1.0.x, so the migration notice is keyed to the major version
            # rather than to one exact tag.
            if [ "${VERSION%%.*}" -ge 2 ] 2>/dev/null; then
              echo "### 这个版本有什么变化 / What's new"
              echo '- **改名为 LetMeCatnap**：应用名、图标、bundle id 都换了，可以和原版（iCanHazRepose）并存。'
              echo '- **如果你还在 1.0.x：需要手动安装一次**（bundle id 改了，旧版更新器会拒绝替换）。设置会自动迁移。'
              echo '- 更新改用 Sparkle：更新包带签名校验，下载或安装失败会明确提示，不再静默。'
              echo '- 休息遮罩**随时可以用 Esc 退出**；菜单里的「允许跳过休息」改成了「显示跳过按钮」，只决定按钮显不显示。'
              echo '- 关于窗口只保留本仓库的 GitHub 入口。'
              echo
            fi
            echo "$CHANGES" | sed '/^$/d'
            echo
            echo "---"
            echo "$RANGE"
          } > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=(dist/LetMeCatnap.zip)
          if [ -f dist/LetMeCatnap.dmg ]; then ASSETS+=(dist/LetMeCatnap.dmg); fi
          # The feed lives next to the archive so `releases/latest/download/
          # appcast.xml` always resolves to the newest published build.
          test -f dist/appcast.xml || { echo "::error::dist/appcast.xml missing"; exit 1; }
          ASSETS+=(dist/appcast.xml)

          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "v$VERSION" "${ASSETS[@]}" \
              --title "LetMeCatnap $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
